# ===========================================================================
# Alembic configuration.
#
# The database URL is intentionally NOT set here: alembic/env.py reads it from
# the application settings (PSX_DATABASE_URL), so migrations always run against
# the same database the application uses and there is no second copy of the
# connection string to forget to update.
# ===========================================================================
[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, ordered filenames - so a directory listing reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Autogenerated migrations are formatted like the rest of the codebase.
# Invoked through the interpreter rather than as a bare "ruff" executable: ruff
# ships as a standalone binary (so it is not a console_scripts entry point), and
# on Windows a bare name is not resolved from the active virtualenv by Alembic's
# subprocess call. "python -m ruff" works on every platform.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
