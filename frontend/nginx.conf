# nginx configuration for the built frontend.
#
# Two jobs: serve the single-page app, and proxy /api to the backend so the browser
# only ever talks to one origin. That second point is what makes CORS a non-issue in
# a deployed setup and mirrors how the Vite dev proxy behaves locally.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable by construction, so they can be cached
    # for a year. index.html must never be cached, or a returning browser would
    # keep loading the previous build's asset names after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Client-side routing: /portfolio and /plans/3 are React Router paths, not files
    # on disk, so anything unmatched falls back to index.html. Without this a page
    # refresh on any route but "/" would return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API. `api` is the service name in docker-compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Passed through so the correlation id in the backend's logs matches the one
        # the browser saw - see app/core/middleware.py.
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Modest hardening. This is an internal tool served over a private network, so
    # this is a floor rather than a complete policy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
